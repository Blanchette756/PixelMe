name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Use the tag as the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          $project = "src/PixelMe/PixelMe.csproj"
          (Get-Content $project -Raw) -replace "<Version>.*</Version>", "<Version>$version</Version>" | Set-Content $project -NoNewline

      - name: Build app and installer
        shell: pwsh
        run: ./tools/publish.ps1

      - name: Create portable zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath artifacts/PixelMe-portable-win-x64.zip

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PixelMe
          path: artifacts/*

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PixelMe ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: |
            artifacts/*.exe
            artifacts/*.zip
